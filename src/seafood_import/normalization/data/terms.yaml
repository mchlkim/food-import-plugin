# 품목. tag 는 규칙 조건에서 쓰는 이름이다.
# category: 어류 / 패류 / 연체류 / 갑각류 / 해조류 / 기타수산물
# generic: 여러 어종을 묶어 부르는 통칭 묶음. 첫 이름, also_generic 의 이름, 영문 이름이 통칭이고
#          나머지 이름(예: 흰다리새우)은 구체적인 품목으로 본다. candidates 는 대표적인 후보이며 전부가 아니다.
# processed: 이름 자체가 가공품을 뜻한다.
products:
  - {tag: seafood_generic, names: [수산물, 해산물, 수산동식물, seafood], category: null, generic: true}
  - {tag: fish_generic, names: [어류, 생선, 활어, fish], category: 어류, generic: true}
  - {tag: scallop, names: [가리비, 큰가리비, 참가리비, 해만가리비, scallop], category: 패류, generic: true, candidates: [큰가리비, 해만가리비, 비단가리비]}
  - {tag: shrimp, names: [새우, 흰다리새우, 블랙타이거새우, 홍다리얼룩새우, 대하, shrimp, prawn], category: 갑각류, generic: true, candidates: [흰다리새우, 홍다리얼룩새우(블랙타이거), 대하]}
  - {tag: squid, names: [오징어, 살오징어, 갑오징어, 한치, squid, cuttlefish], category: 연체류, generic: true, candidates: [살오징어, 갑오징어, 화살오징어(한치)]}
  - {tag: salmon, names: [연어, 대서양연어, 은연어, 홍연어, salmon], category: 어류, generic: true, candidates: [대서양연어, 은연어, 홍연어, 왕연어]}
  - {tag: bluefin_tuna, names: [참다랑어, 참치(참다랑어), bluefin tuna], category: 어류}
  - {tag: tuna, names: [다랑어, 참치, 눈다랑어, 황다랑어, 가다랑어, tuna], category: 어류, generic: true, also_generic: [참치], candidates: [참다랑어, 눈다랑어, 황다랑어, 가다랑어]}
  - {tag: buse, names: [부세], category: 어류}
  - {tag: croaker, names: [조기, 참조기, croaker], category: 어류, generic: true, candidates: [참조기, 부세]}
  - {tag: pufferfish, names: [복어, 복, 자주복, 참복, 까치복, pufferfish, fugu], category: 어류, generic: true, also_generic: [복], candidates: [자주복, 까치복, 검복, 밀복]}
  - {tag: filefish_jerky, names: [조미쥐치포, 쥐치포, 쥐포], category: 어류, processed: true}
  - {tag: pollock, names: [명태, 동태, 황태, 북어, pollock], category: 어류}
  - {tag: cod, names: [대구, cod], category: 어류}
  - {tag: mackerel, names: [고등어, mackerel], category: 어류}
  - {tag: hairtail, names: [갈치, hairtail], category: 어류}
  - {tag: saury, names: [꽁치, saury], category: 어류}
  - {tag: yellowtail, names: [방어, yellowtail], category: 어류}
  - {tag: seabream, names: [돔, 참돔, 감성돔, 돌돔, sea bream], category: 어류, generic: true, candidates: [참돔, 감성돔, 돌돔]}
  - {tag: flounder, names: [넙치, 광어, 가자미, flounder, halibut], category: 어류}
  - {tag: eel, names: [장어, 뱀장어, 민물장어, 붕장어, 갯장어, 먹장어, eel], category: 어류, generic: true, candidates: [뱀장어, 붕장어, 갯장어, 먹장어]}
  - {tag: octopus, names: [문어, 낙지, 주꾸미, 쭈꾸미, octopus], category: 연체류}
