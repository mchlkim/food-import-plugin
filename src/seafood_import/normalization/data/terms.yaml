  - {tag: lobster, names: [바닷가재, 랍스터, 로브스터, lobster], category: 갑각류}
  - {tag: abalone, names: [전복, abalone], category: 패류}
  - {tag: oyster, names: [굴, oyster], category: 패류}
  - {tag: clam, names: [조개, 바지락, 모시조개, 백합, 홍합, clam, mussel], category: 패류, generic: true, candidates: [바지락, 백합, 홍합, 모시조개]}
  - {tag: sea_squirt, names: [멍게, 우렁쉥이], category: 기타수산물}
  - {tag: sea_cucumber, names: [해삼], category: 기타수산물}
  - {tag: sea_urchin, names: [성게], category: 기타수산물}
  - {tag: laver, names: [김, laver], category: 해조류}
  - {tag: seaweed, names: [해조류, 해조, 미역, 다시마, 톳, seaweed, kelp], category: 해조류, generic: true, also_generic: [해조], candidates: [미역, 다시마, 톳]}
  - {tag: fish_cake, names: [어묵, 어육가공품, 맛살], category: 어류, processed: true}
  - {tag: salted_fermented, names: [젓갈, 명란젓, 새우젓, 액젓], category: null, processed: true}

# 한 글자 품목명은 다른 낱말의 일부와 겹치므로 문장 해석에서 앞뒤 글자를 확인한다.
single_char_products: [게, 굴, 김, 복, 돔]

# 상태 표현 → 코드. processed: true 면 가공식품으로 본다.
# 원물 범위는 식약처 정의(식품첨가물이나 다른 원료를 쓰지 않고 원형을 알아볼 수 있게
# 단순히 절단·가열·숙성·건조·염장한 수산동식물)를 따른다.
states:
  frozen: {names: [냉동, 동결, frozen], processed: false}
  chilled: {names: [냉장, 신선, 선어, chilled, fresh], processed: false}
  live: {names: [활어, 활, 살아있는, 살아 있는, 산, live], processed: false}
  dried: {names: [건조, 건, 말린, dried], processed: false}
  salted: {names: [염장, 염장한, 소금에 절인, salted], processed: false}
  boiled: {names: [자숙, 가열, 삶은, boiled], processed: false}
  seasoned: {names: [조미, 양념, seasoned], processed: true}
  smoked: {names: [훈제, smoked], processed: true}
  canned: {names: [통조림, 캔, canned], processed: true}
  processed: {names: [가공식품, 가공품, 가공, 튀김, 필렛튀김, processed], processed: true}

# 문장 해석 때 '활', '산', '건' 같은 한 글자 상태는 품목명 바로 앞에 붙었을 때만 인정한다.
single_char_states: [활, 산, 건]
