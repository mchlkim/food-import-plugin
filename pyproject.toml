[project]
name = "seafood-import-plugin"
version = "0.2.0"
description = "수산물 수입신고 구비서류 조회: 식약처 공식 자료와 승인된 규칙으로 판정하는 엔진, CLI, MCP 서버, Agent Skill"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "pypdf>=4.0",
]

[project.optional-dependencies]
mcp = ["mcp>=2.0,<3"]
dev = ["pytest>=8", "mcp>=2.0,<3"]

[project.scripts]
seafood-import = "seafood_import.cli.main:main"
seafood-import-mcp = "seafood_import.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seafood_import"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: 실제 공식 사이트에 접속하는 테스트 (기본 실행에서 제외, -m live 로 실행)",
]
addopts = "-m 'not live'"
